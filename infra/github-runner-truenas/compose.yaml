services:
  runner:
    image: github-runner-weltraum:pw1.61.1-runner2.335.1-r1
    pull_policy: build
    build:
      context: /mnt/Storage/apps/github-runner-weltraum/deployment
      dockerfile: Dockerfile
      args:
        PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
        NODE_VERSION: 22.23.1
        NODE_SHA256: 9749e988f437343b7fa832c69ded82a312e41a03116d766797ac14f6f9eee578
        ACTIONS_RUNNER_VERSION: 2.335.1
        ACTIONS_RUNNER_SHA256: 4ef2f25285f0ae4477f1fe1e346db76d2f3ebf03824e2ddd1973a2819bf6c8cf
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    cpus: 4.0
    mem_limit: 8g
    shm_size: 2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=/mnt/Storage/apps/github-runner-weltraum/deployment/seccomp_profile.json
    tmpfs:
      - /tmp:size=1g,mode=1777
    environment:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      npm_config_cache: /home/runner/.npm
      RUNNER_TOOL_CACHE: /runner-state/_tool
      RUNNER_REPOSITORY_URL: https://github.com/BenjaminHornung/Weltraum-Spiel
      RUNNER_NAME: truenas-weltraum-browser-01
      RUNNER_LABELS: weltraum-browser,truenas
      RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/runner-registration-token
      ACTIONS_RUNNER_HOOK_JOB_STARTED: /opt/runner-hooks/job-started.sh
      ACTIONS_RUNNER_HOOK_JOB_COMPLETED: /opt/runner-hooks/job-completed.sh
    volumes:
      - type: bind
        source: /mnt/Storage/apps/github-runner-weltraum/state
        target: /runner-state
      - type: bind
        source: /mnt/Storage/apps/github-runner-weltraum/work
        target: /runner-state/_work
      - type: bind
        source: /mnt/Storage/apps/github-runner-weltraum/npm-cache
        target: /home/runner/.npm
      - type: bind
        source: /mnt/Storage/apps/github-runner-weltraum/logs
        target: /runner-state/_diag
      - type: bind
        source: /mnt/Storage/apps/github-runner-weltraum/secrets/runner-registration-token
        target: /run/secrets/runner-registration-token
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[R]unner.Listener' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
