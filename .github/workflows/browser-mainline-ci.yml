name: Browser Mainline CI

on:
  pull_request:
    paths:
      - "apps/weltraum-browser/**"
      - ".github/workflows/browser-mainline-ci.yml"
      - "docs/browser-mainline/**"
      - ".devtoolbox/specs/changes/browser-*/**"
  push:
    branches:
      - main
    paths:
      - "apps/weltraum-browser/**"
      - ".github/workflows/browser-mainline-ci.yml"
      - "docs/browser-mainline/**"
      - ".devtoolbox/specs/changes/browser-*/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-mainline:
    name: Browser mainline verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/weltraum-browser

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore required browser LFS artifacts if checked out as pointers
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          glb_path="apps/weltraum-browser/public/ships/demo_scout_mk1.glb"
          reference_pngs=(
            "apps/weltraum-browser/evidence/ui-concept-parity-v1-rejected-flight-hud.png"
            "apps/weltraum-browser/evidence/ui-concept-parity-v1-rejected-flight-hud-1280x720.png"
            "apps/weltraum-browser/evidence/ui-concept-parity-v1-rejected-navigation-planner.png"
            "apps/weltraum-browser/evidence/ui-concept-parity-v1-rejected-combat-contact.png"
          )
          required_lfs_paths=("$glb_path" "${reference_pngs[@]}")

          needs_lfs_pull=false
          for path in "${required_lfs_paths[@]}"; do
            if [ ! -f "$path" ]; then
              echo "::error::Expected browser artifact is missing at $path"
              exit 1
            fi
            if head -c 80 "$path" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              needs_lfs_pull=true
            fi
          done

          if [ "$needs_lfs_pull" = true ]; then
            include_paths=$(IFS=,; echo "${required_lfs_paths[*]}")
            echo "Required browser artifacts include LFS pointers; pulling only $include_paths"
            git lfs install --local
            git lfs pull --include="$include_paths" --exclude=""
          else
            echo "Required browser artifacts are present as normal files; no LFS pull needed."
          fi

          if [ "$(head -c 4 "$glb_path")" != "glTF" ]; then
            echo "::error::Demo Scout GLB did not resolve to a GLB binary."
            exit 1
          fi

          for path in "${reference_pngs[@]}"; do
            png_signature=$(od -An -tx1 -N8 "$path" | tr -d ' \n')
            if [ "$png_signature" != "89504e470d0a1a0a" ]; then
              echo "::error::Reference image did not resolve to a PNG binary: $path"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/weltraum-browser/package-lock.json

      - name: Install browser dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test

      - name: Build browser app
        run: npm run build

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-mainline-ci-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/weltraum-browser/playwright-report/**
            apps/weltraum-browser/test-results/**
            apps/weltraum-browser/evidence/playwright-report/**
            apps/weltraum-browser/evidence/playwright-output/**
            apps/weltraum-browser/evidence/*.png
            apps/weltraum-browser/evidence/*.json
