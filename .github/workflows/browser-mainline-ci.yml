name: Browser Mainline CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-mainline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-mainline:
    name: Browser mainline verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/weltraum-browser

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Verify required browser artifacts
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          glb_path="apps/weltraum-browser/public/ships/demo_scout_mk1.glb"
          favicon_path="apps/weltraum-browser/public/favicon.png"
          reference_pngs=(
            "apps/weltraum-browser/evidence/ui-concept-parity-v1-rejected-flight-hud.png"
            "apps/weltraum-browser/evidence/ui-concept-parity-v1-rejected-flight-hud-1280x720.png"
            "apps/weltraum-browser/evidence/ui-concept-parity-v1-rejected-navigation-planner.png"
            "apps/weltraum-browser/evidence/ui-concept-parity-v1-rejected-combat-contact.png"
            "apps/weltraum-browser/tests/e2e/render-backend-mesh-lifecycle.spec.ts-snapshots/render-backend-parent-fallback.png"
            "apps/weltraum-browser/tests/e2e/render-backend-mesh-lifecycle.spec.ts-snapshots/render-backend-child-active.png"
            "apps/weltraum-browser/tests/e2e/render-backend-mesh-lifecycle.spec.ts-snapshots/render-backend-replacement-active.png"
          )

          required_paths=("$glb_path" "$favicon_path" "${reference_pngs[@]}")
          for path in "${required_paths[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Expected browser artifact is missing at $path"
              exit 1
            fi
            if head -c 80 "$path" | grep -q "version https://git-lfs.github.com/spec/v1"; then
              echo "::error::Git LFS pointer was not resolved: $path"
              exit 1
            fi
          done

          if [[ "$(head -c 4 "$glb_path")" != "glTF" ]]; then
            echo "::error::Demo Scout GLB did not resolve to a GLB binary."
            exit 1
          fi

          for path in "$favicon_path" "${reference_pngs[@]}"; do
            png_signature="$(od -An -tx1 -N8 "$path" | tr -d ' \n')"
            if [[ "$png_signature" != "89504e470d0a1a0a" ]]; then
              echo "::error::Reference image did not resolve to a PNG binary: $path"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/weltraum-browser/package-lock.json

      - name: Install browser dependencies
        id: install_browser_dependencies
        run: npm ci

      - name: Install Playwright Chromium
        id: install_playwright
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright toolchain and WebGL
        id: verify_playwright
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version
          npx playwright --version

          node --input-type=module <<'NODE'
          import { constants } from "node:fs";
          import { access, readFile } from "node:fs/promises";
          import { chromium } from "playwright";

          const lock = JSON.parse(await readFile("package-lock.json", "utf8"));
          const expected = lock.packages?.["node_modules/@playwright/test"]?.version;
          const installedTest = JSON.parse(
            await readFile("node_modules/@playwright/test/package.json", "utf8")
          ).version;
          const installedPlaywright = JSON.parse(
            await readFile("node_modules/playwright/package.json", "utf8")
          ).version;

          if (!expected || expected !== installedTest || expected !== installedPlaywright) {
            throw new Error(
              `Playwright version mismatch: lock=${expected} @playwright/test=${installedTest} playwright=${installedPlaywright}`
            );
          }
          if (expected !== "1.61.1") {
            throw new Error(`Expected the pinned Playwright 1.61.1 toolchain, received ${expected}`);
          }

          const executable = chromium.executablePath();
          await access(executable, constants.X_OK);

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const webgl = await page.evaluate(() => {
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("webgl2") || canvas.getContext("webgl");
            return {
              available: Boolean(context),
              renderer: context ? context.getParameter(context.RENDERER) : null,
              vendor: context ? context.getParameter(context.VENDOR) : null
            };
          });
          const browserVersion = browser.version();
          await browser.close();

          if (!webgl.available) {
            throw new Error("Headless Chromium did not provide a WebGL context.");
          }

          console.log(JSON.stringify({ expected, executable, browserVersion, webgl }, null, 2));
          NODE

      - name: Run unit tests
        id: unit_tests
        run: npm run test

      - name: Build browser app
        id: browser_build
        run: npm run build

      - name: Validate Playwright CI group membership
        id: playwright_group_membership
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          import { join } from "node:path";

          async function discoverSpecs(directory) {
            const specs = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const entryPath = join(directory, entry.name);
              if (entry.isDirectory()) {
                specs.push(...await discoverSpecs(entryPath));
              } else if (entry.isFile() && entry.name.endsWith(".spec.ts")) {
                specs.push(entryPath.replaceAll("\\", "/"));
              }
            }
            return specs;
          }

          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          const discoveredSpecs = (await discoverSpecs("tests/e2e")).sort();
          const discoveredSpecSet = new Set(discoveredSpecs);
          const groupScripts = ["test:e2e:core", "test:e2e:live", "test:e2e:ui"];
          const allowedSpecToken = /^tests\/e2e\/[A-Za-z0-9_./-]+\.spec\.ts$/;

          function parseGroupScript(scriptName, script, knownSpecs) {
            if (typeof script !== "string") {
              throw new Error(`Missing required Playwright group script: ${scriptName}`);
            }
            const tokens = script.trim().split(/\s+/);
            if (tokens.length < 3 || tokens[0] !== "playwright" || tokens[1] !== "test") {
              throw new Error(`${scriptName} must be 'playwright test' followed only by explicit spec paths.`);
            }
            const specs = tokens.slice(2);
            for (const token of specs) {
              if (!allowedSpecToken.test(token)) {
                throw new Error(`${scriptName} contains a non-spec token: ${token}`);
              }
              if (!knownSpecs.has(token)) {
                throw new Error(`${scriptName} contains a stale or undiscovered spec path: ${token}`);
              }
            }
            return specs;
          }

          const parserFixtureSpecs = new Set([
            "tests/e2e/actually-run.spec.ts",
            "tests/e2e/not-run.spec.ts"
          ]);
          parseGroupScript(
            "parser-valid-fixture",
            "playwright test tests/e2e/actually-run.spec.ts",
            parserFixtureSpecs
          );
          for (const invalid of [
            "playwright test tests/e2e/actually-run.spec.ts || echo tests/e2e/not-run.spec.ts",
            "playwright test tests/e2e/actually-run.spec.ts --grep tests/e2e/not-run.spec.ts"
          ]) {
            let rejected = false;
            try {
              parseGroupScript("parser-invalid-fixture", invalid, parserFixtureSpecs);
            } catch {
              rejected = true;
            }
            if (!rejected) {
              throw new Error(`Strict Playwright group parser accepted an unsafe command: ${invalid}`);
            }
          }

          if (packageJson.scripts?.["test:e2e"] !== "playwright test") {
            throw new Error("The aggregate test:e2e script must remain exactly 'playwright test'.");
          }

          const groupedSpecs = groupScripts.flatMap((scriptName) =>
            parseGroupScript(scriptName, packageJson.scripts?.[scriptName], discoveredSpecSet)
          );
          const counts = new Map();
          for (const spec of groupedSpecs) {
            counts.set(spec, (counts.get(spec) ?? 0) + 1);
          }

          const unassigned = discoveredSpecs.filter((spec) => !counts.has(spec));
          const duplicates = [...counts]
            .filter(([, count]) => count !== 1)
            .map(([spec, count]) => ({ spec, count }));
          const extra = [...counts.keys()].filter((spec) => !discoveredSpecSet.has(spec));

          if (unassigned.length || duplicates.length || extra.length) {
            console.error(JSON.stringify({ unassigned, duplicates, extra }, null, 2));
            process.exit(1);
          }

          console.log(`Validated ${discoveredSpecs.length} Playwright specs assigned exactly once.`);
          NODE

      - name: Run Playwright core and autopilot E2E
        if: ${{ !cancelled() && steps.install_browser_dependencies.outcome == 'success' && steps.install_playwright.outcome == 'success' && steps.verify_playwright.outcome == 'success' && steps.browser_build.outcome == 'success' && steps.playwright_group_membership.outcome == 'success' }}
        env:
          WELTRAUM_PLAYWRIGHT_ARTIFACT_GROUP: core-autopilot
        run: npm run test:e2e:core

      - name: Run Playwright live runtime and objectives E2E
        if: ${{ !cancelled() && steps.install_browser_dependencies.outcome == 'success' && steps.install_playwright.outcome == 'success' && steps.verify_playwright.outcome == 'success' && steps.browser_build.outcome == 'success' && steps.playwright_group_membership.outcome == 'success' }}
        env:
          WELTRAUM_PLAYWRIGHT_ARTIFACT_GROUP: live-runtime
        run: npm run test:e2e:live

      - name: Run Playwright UI and layout E2E
        if: ${{ !cancelled() && steps.install_browser_dependencies.outcome == 'success' && steps.install_playwright.outcome == 'success' && steps.verify_playwright.outcome == 'success' && steps.browser_build.outcome == 'success' && steps.playwright_group_membership.outcome == 'success' }}
        env:
          WELTRAUM_PLAYWRIGHT_ARTIFACT_GROUP: ui-layout
        run: npm run test:e2e:ui

      - name: Validate browser evidence JSON
        if: ${{ !cancelled() && steps.install_browser_dependencies.outcome == 'success' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";

          const evidenceFiles = (await readdir("evidence", { withFileTypes: true }))
            .filter((entry) => entry.isFile() && entry.name.endsWith(".json"))
            .map((entry) => entry.name)
            .sort();

          for (const file of evidenceFiles) {
            JSON.parse(await readFile(`evidence/${file}`, "utf8"));
          }

          console.log(`Validated ${evidenceFiles.length} top-level browser evidence JSON files.`);
          NODE

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-mainline-ci-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            apps/weltraum-browser/playwright-report/**
            apps/weltraum-browser/test-results/**
            apps/weltraum-browser/evidence/playwright-report/**
            apps/weltraum-browser/evidence/playwright-output/**
