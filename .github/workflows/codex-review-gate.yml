name: Codex Review Gate

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-head-reviewed:
    name: Current head reviewed
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Classify pull request trust boundary
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          set_gate_status() {
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state="$1" \
              -f context="Codex Review / current head" \
              -f description="$2" \
              -f target_url="${RUN_URL}" \
              >/dev/null
          }

          if [[ "${IS_DRAFT}" == "true" ]]; then
            echo "trusted=false" >> "${GITHUB_OUTPUT}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            set_gate_status success "Codex review deferred while pull request is draft"
            exit 0
          fi

          if [[ "${SOURCE_REPOSITORY}" != "${REPOSITORY}" ]]; then
            echo "trusted=false" >> "${GITHUB_OUTPUT}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            set_gate_status success "External PR uses manual owner review; Codex token withheld"
            exit 0
          fi

          echo "trusted=true" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          set_gate_status pending "Preparing Codex review for ${HEAD_SHA:0:10}"

      - name: Find existing exact-head request
        id: existing
        if: steps.classify.outputs.trusted == 'true'
        shell: bash
        run: |
          set -euo pipefail

          marker="<!-- codex-review-request:${HEAD_SHA} -->"
          request_record="$(
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              | jq -c --arg marker "${marker}" '
                  [
                    .[][]? |
                    select((.body // "") | contains($marker))
                  ][-1] // empty |
                  if . == null then empty else {id, created_at} end
                '
          )"

          if [[ -z "${request_record}" ]]; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "found=true" >> "${GITHUB_OUTPUT}"
          echo "comment_id=$(jq -r '.id' <<<"${request_record}")" >> "${GITHUB_OUTPUT}"
          echo "created_at=$(jq -r '.created_at' <<<"${request_record}")" >> "${GITHUB_OUTPUT}"

      - name: Authenticate CODEX_REVIEW_TOKEN
        id: token
        if: steps.classify.outputs.trusted == 'true' && steps.existing.outputs.found != 'true'
        shell: bash
        env:
          CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        run: |
          set -euo pipefail

          [[ -n "${CODEX_REVIEW_TOKEN}" ]] || {
            echo "::error::CODEX_REVIEW_TOKEN is missing"
            exit 1
          }

          token_login="$(GH_TOKEN="${CODEX_REVIEW_TOKEN}" gh api user --jq '.login')"
          [[ -n "${token_login}" ]] || {
            echo "::error::CODEX_REVIEW_TOKEN returned no user login"
            exit 1
          }
          echo "login=${token_login}" >> "${GITHUB_OUTPUT}"

      - name: Create exact-head Codex request
        id: created
        if: steps.classify.outputs.trusted == 'true' && steps.existing.outputs.found != 'true'
        shell: bash
        env:
          CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        run: |
          set -euo pipefail

          marker="<!-- codex-review-request:${HEAD_SHA} -->"
          printf -v request_body \
            '@codex review\n\nPlease review the current pull-request head `%s`.\n\n%s\n' \
            "${HEAD_SHA:0:10}" \
            "${marker}"

          request_record="$(
            GH_TOKEN="${CODEX_REVIEW_TOKEN}" gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="${request_body}" \
              --jq '{id, created_at}'
          )"

          echo "comment_id=$(jq -r '.id' <<<"${request_record}")" >> "${GITHUB_OUTPUT}"
          echo "created_at=$(jq -r '.created_at' <<<"${request_record}")" >> "${GITHUB_OUTPUT}"

      - name: Report Codex request failure
        if: failure() && steps.classify.outputs.trusted == 'true'
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="failure" \
            -f context="Codex Review / current head" \
            -f description="Codex request setup failed for ${HEAD_SHA:0:10}" \
            -f target_url="${RUN_URL}" \
            >/dev/null

      - name: Verify Codex result for exact head
        if: success() && steps.classify.outputs.trusted == 'true'
        shell: bash
        env:
          REQUEST_COMMENT_ID: ${{ steps.existing.outputs.comment_id || steps.created.outputs.comment_id }}
          REQUEST_CREATED_AT: ${{ steps.existing.outputs.created_at || steps.created.outputs.created_at }}
        run: |
          set -euo pipefail

          short_sha="${HEAD_SHA:0:10}"

          set_gate_status() {
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state="$1" \
              -f context="Codex Review / current head" \
              -f description="$2" \
              -f target_url="${RUN_URL}" \
              >/dev/null
          }

          fail_status_on_exit() {
            exit_code=$?
            trap - EXIT
            if [[ ${exit_code} -ne 0 ]]; then
              set_gate_status failure "Codex review missing for ${short_sha}" || true
            fi
            exit "${exit_code}"
          }

          complete_success() {
            set_gate_status success "$1"
            trap - EXIT
            exit 0
          }

          [[ -n "${REQUEST_COMMENT_ID}" && -n "${REQUEST_CREATED_AT}" ]] || {
            echo "::error::Exact-head request metadata is missing"
            exit 1
          }

          codex_review_exists() {
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              | jq -e --arg head "${HEAD_SHA}" '
                  any(.[][]?;
                    (((.user.login // "") == "chatgpt-codex-connector[bot]") or
                     ((.user.login // "") == "chatgpt-codex-connector")) and
                    ((.commit_id // "") == $head)
                  )
                ' >/dev/null
          }

          codex_result_comment_exists() {
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              | jq -e \
                  --arg full "${HEAD_SHA}" \
                  --arg short "${short_sha}" \
                  --arg requested_at "${REQUEST_CREATED_AT}" '
                    any(.[][]?;
                      (.body // "") as $body |
                      (((.user.login // "") == "chatgpt-codex-connector[bot]") or
                       ((.user.login // "") == "chatgpt-codex-connector")) and
                      ((.created_at // "") >= $requested_at) and
                      (
                        ($body | contains("Reviewed PR head `" + $full + "`")) or
                        ($body | contains("reviewed the PR head commit `" + $full + "`")) or
                        ($body | contains("**Reviewed commit:** `" + $full + "`")) or
                        ($body | contains("Reviewed commit: `" + $full + "`")) or
                        ($body | contains("**Reviewed commit:** `" + $short + "`")) or
                        ($body | contains("Reviewed commit: `" + $short + "`"))
                      )
                    )
                  ' >/dev/null
          }

          codex_reaction_exists() {
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/issues/comments/${REQUEST_COMMENT_ID}/reactions?per_page=100" \
              | jq -e '
                  any(.[][]?;
                    (((.user.login // "") == "chatgpt-codex-connector[bot]") or
                     ((.user.login // "") == "chatgpt-codex-connector")) and
                    (.content == "+1")
                  )
                ' >/dev/null
          }

          trap fail_status_on_exit EXIT

          for _ in {1..30}; do
            if codex_review_exists || codex_result_comment_exists; then
              complete_success "Codex reviewed ${short_sha}"
            fi
            if codex_reaction_exists; then
              complete_success "Codex found no comments for ${short_sha}"
            fi
            sleep 20
          done

          echo "::error::No Codex result was found for current head ${HEAD_SHA}."
          exit 1
