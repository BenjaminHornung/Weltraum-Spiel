name: Codex Review Gate

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  current-head-reviewed:
    name: Current head reviewed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Request and verify Codex review for the current head
        shell: bash
        run: |
          set -euo pipefail

          command -v gh >/dev/null
          command -v jq >/dev/null

          short_sha="${HEAD_SHA:0:10}"
          marker="<!-- codex-review-request:${HEAD_SHA} -->"
          status_context="Codex Review / current head"

          set_gate_status() {
            local state="$1"
            local description="$2"

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state="${state}" \
              -f context="${status_context}" \
              -f description="${description}" \
              -f target_url="${RUN_URL}" \
              >/dev/null
          }

          fail_status_on_exit() {
            local exit_code=$?
            if [[ ${exit_code} -ne 0 ]]; then
              set_gate_status "failure" "Codex review gate failed for ${short_sha}" || true
            fi
            exit "${exit_code}"
          }

          trap fail_status_on_exit EXIT
          set_gate_status "pending" "Waiting for Codex review of ${short_sha}"

          report_success() {
            local proof="$1"
            {
              echo "## Codex review verified"
              echo
              echo "- Pull request: #${PR_NUMBER}"
              echo "- Reviewed head: \`${HEAD_SHA}\`"
              echo "- Proof: ${proof}"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          complete_success() {
            local proof="$1"
            local description="$2"
            report_success "${proof}"
            set_gate_status "success" "${description}"
            trap - EXIT
            exit 0
          }

          if [[ "${IS_DRAFT}" == "true" ]]; then
            {
              echo "## Codex review deferred"
              echo
              echo "Draft pull requests are reviewed when they become ready for review."
            } >> "${GITHUB_STEP_SUMMARY}"
            set_gate_status "success" "Review deferred while pull request is draft"
            trap - EXIT
            exit 0
          fi

          codex_review_exists() {
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              | jq -e --arg short "${short_sha}" --arg full "${HEAD_SHA}" '
                  any(.[][]?;
                    (((.user.login // "") == "chatgpt-codex-connector[bot]") or
                     ((.user.login // "") == "chatgpt-codex-connector")) and
                    ((((.body // "") | contains($short))) or
                     (((.body // "") | contains($full))))
                  )
                ' >/dev/null
          }

          find_request_comment_id() {
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              | jq -r --arg marker "${marker}" '
                  [.[][]? | select((.body // "") | contains($marker))][-1].id // empty
                '
          }

          codex_acknowledged_request() {
            local comment_id="$1"
            [[ -n "${comment_id}" ]] || return 1

            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/issues/comments/${comment_id}/reactions?per_page=100" \
              | jq -e '
                  any(.[][]?;
                    (((.user.login // "") == "chatgpt-codex-connector[bot]") or
                     ((.user.login // "") == "chatgpt-codex-connector")) and
                    (.content == "+1")
                  )
                ' >/dev/null
          }

          # Give the repository-level automatic trigger a brief chance to finish
          # before creating an explicit, head-specific review request.
          for _ in {1..6}; do
            if codex_review_exists; then
              complete_success \
                "Codex review submission for the current head" \
                "Codex reviewed ${short_sha}"
            fi
            sleep 10
          done

          request_comment_id="$(find_request_comment_id)"

          if [[ -z "${request_comment_id}" ]]; then
            if [[ -z "${CODEX_REVIEW_TOKEN}" ]]; then
              {
                echo "## Codex review token missing"
                echo
                echo "No current-head Codex review exists and the repository secret \`CODEX_REVIEW_TOKEN\` is not configured."
                echo
                echo "Add the narrowly scoped linked-user token described in \`.github/CODEX_REVIEW_GATE.md\`, or comment \`@codex review\` manually and re-run this workflow."
              } >> "${GITHUB_STEP_SUMMARY}"
              echo "::error::CODEX_REVIEW_TOKEN is required for automatic current-head re-review requests."
              exit 1
            fi

            printf -v request_body \
              '@codex review\n\nPlease review the current pull-request head `%s`. This request is repeated after every new head commit so the merge gate cannot rely on a stale review.\n\n%s\n' \
              "${short_sha}" \
              "${marker}"

            if ! request_response="$(GH_TOKEN="${CODEX_REVIEW_TOKEN}" gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="${request_body}" 2>&1)"; then
              echo "${request_response}"
              echo "::error::Unable to post the current-head Codex review request with CODEX_REVIEW_TOKEN."
              exit 1
            fi

            request_comment_id="$(jq -r '.id' <<<"${request_response}")"
          fi

          # Accept either a Codex review submission naming the current head, or
          # Codex's thumbs-up reaction when it found no review comments.
          for _ in {1..36}; do
            if codex_review_exists; then
              complete_success \
                "Codex review submission for the current head" \
                "Codex reviewed ${short_sha}"
            fi

            if codex_acknowledged_request "${request_comment_id}"; then
              complete_success \
                "Codex thumbs-up on the current-head review request" \
                "Codex found no comments for ${short_sha}"
            fi

            sleep 45
          done

          {
            echo "## Codex review missing"
            echo
            echo "No Codex result was found for head \`${HEAD_SHA}\`."
            echo
            echo "Comment \`@codex review\` on pull request #${PR_NUMBER}, then re-run this workflow."
            echo "Verify that \`CODEX_REVIEW_TOKEN\` belongs to the GitHub user connected to Codex."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::error::Codex did not review current pull-request head ${HEAD_SHA}."
          exit 1
