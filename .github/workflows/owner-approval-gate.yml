name: Owner Approval Gate

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: owner-approval-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  initialize-current-head:
    name: Initialize owner approval
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Require exact-head owner approval
        shell: bash
        run: |
          set -euo pipefail

          state="pending"
          description="Awaiting owner approval for ${HEAD_SHA:0:10}"
          if [[ "${IS_DRAFT}" == "true" ]]; then
            state="success"
            description="Owner approval deferred while pull request is draft"
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context="Owner Approval / current head" \
            -f description="${description}" \
            -f target_url="${RUN_URL}" \
            >/dev/null

  apply-owner-command:
    name: Apply owner approval command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'BenjaminHornung' &&
      github.event.comment.user.id == 25324591
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Validate and apply exact-head command
        shell: bash
        run: |
          set -euo pipefail

          command=""
          requested_sha=""
          if [[ "${COMMENT_BODY}" =~ ^/approve-head[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
            command="approve"
            requested_sha="${BASH_REMATCH[1]}"
          elif [[ "${COMMENT_BODY}" =~ ^/revoke-head[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
            command="revoke"
            requested_sha="${BASH_REMATCH[1]}"
          else
            echo "Comment is not an owner-approval command; no status changed."
            exit 0
          fi

          pr="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"

          state="$(jq -r '.state' <<<"${pr}")"
          draft="$(jq -r '.draft' <<<"${pr}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr}")"
          current_head="$(jq -r '.head.sha' <<<"${pr}")"

          [[ "${state}" == "open" ]] || {
            echo "::error::Pull request #${PR_NUMBER} is not open."
            exit 1
          }
          [[ "${draft}" == "false" ]] || {
            echo "::error::Pull request #${PR_NUMBER} is still a draft."
            exit 1
          }
          [[ "${base_ref}" == "main" ]] || {
            echo "::error::Pull request #${PR_NUMBER} does not target main."
            exit 1
          }
          [[ "${requested_sha}" == "${current_head}" ]] || {
            echo "::error::Requested SHA ${requested_sha} is stale; current head is ${current_head}."
            exit 1
          }

          if [[ "${command}" == "approve" ]]; then
            status_state="success"
            description="Owner approved ${current_head:0:10}"
          else
            status_state="failure"
            description="Owner revoked approval for ${current_head:0:10}"
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/statuses/${current_head}" \
            -f state="${status_state}" \
            -f context="Owner Approval / current head" \
            -f description="${description}" \
            -f target_url="${RUN_URL}" \
            >/dev/null

          {
            echo "## Owner approval updated"
            echo
            echo "- Pull request: #${PR_NUMBER}"
            echo "- Head: \`${current_head}\`"
            echo "- Command: \`${command}\`"
            echo "- Status: \`${status_state}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
