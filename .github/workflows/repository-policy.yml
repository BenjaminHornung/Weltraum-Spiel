name: Repository Policy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          show-progress: false

      - name: Validate public repository policy structurally
        shell: bash
        run: |
          set -euo pipefail
          ruby -c .github/scripts/validate_repository_policy.rb
          ruby .github/scripts/validate_repository_policy.rb
