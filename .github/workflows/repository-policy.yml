name: Repository Policy

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "docs/operations/public-repository-security.md"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "docs/operations/public-repository-security.md"

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          show-progress: false

      - name: Parse repository YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "psych"

          paths = Dir.glob(".github/**/*.{yml,yaml}").sort
          raise "No GitHub YAML files found" if paths.empty?

          paths.each do |path|
            Psych.parse_file(path)
            puts "Parsed #{path}"
          end
          RUBY

      - name: Enforce immutable actions and hosted runners
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import pathlib
          import re

          root = pathlib.Path(".github/workflows")
          workflows = sorted([*root.glob("*.yml"), *root.glob("*.yaml")])
          action_ref = re.compile(r"(?m)^\s*uses:\s*([^\s#]+)\s*(?:#.*)?$")
          full_sha = re.compile(r"^[^@\s]+@[0-9a-f]{40}$")
          forbidden_runner = re.compile(
              r"(?im)^\s*runs-on:\s*.*(?:self-hosted|weltraum-browser|truenas).*$"
          )
          write_all = re.compile(r"(?im)^\s*permissions:\s*write-all\s*$")

          for path in workflows:
              text = path.read_text(encoding="utf-8")
              if forbidden_runner.search(text):
                  raise SystemExit(f"{path}: self-hosted or retired runner routing is forbidden")
              if write_all.search(text):
                  raise SystemExit(f"{path}: permissions write-all is forbidden")
              if re.search(r"(?m)^\s*id-token:\s*write\s*$", text):
                  raise SystemExit(f"{path}: id-token write requires a separate security change")
              for match in action_ref.finditer(text):
                  value = match.group(1)
                  if not full_sha.fullmatch(value):
                      raise SystemExit(f"{path}: action is not pinned to a full SHA: {value}")

          print(f"Validated immutable action pins and hosted runners in {len(workflows)} workflows.")
          PY

      - name: Enforce trusted-context workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import pathlib
          import re

          root = pathlib.Path(".github/workflows")
          workflows = sorted([*root.glob("*.yml"), *root.glob("*.yaml")])
          allowed_target = {
              "codex-review-gate.yml",
              "owner-approval-gate.yml",
          }

          for path in workflows:
              text = path.read_text(encoding="utf-8")
              has_target = bool(re.search(r"(?m)^\s{2}pull_request_target:\s*$", text))
              if has_target and path.name not in allowed_target:
                  raise SystemExit(f"{path}: pull_request_target is not allowlisted")
              if path.name in allowed_target:
                  if not has_target:
                      raise SystemExit(f"{path}: trusted workflow lost pull_request_target")
                  if "actions/checkout@" in text:
                      raise SystemExit(f"{path}: trusted workflow must never use checkout")
                  if re.search(r"(?im)\bgit\s+(?:clone|checkout|switch)\b", text):
                      raise SystemExit(f"{path}: trusted workflow must never fetch PR code")
                  if not re.search(r"(?m)^\s*contents:\s*read\s*$", text):
                      raise SystemExit(f"{path}: trusted workflow must keep contents read-only")

          codex = (root / "codex-review-gate.yml").read_text(encoding="utf-8")
          required_codex = (
              'SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}',
              "steps.classify.outputs.trusted == 'true'",
              "short_sha_resolves_to_head",
          )
          for marker in required_codex:
              if marker not in codex:
                  raise SystemExit(f"codex-review-gate.yml: missing security marker: {marker}")

          owner = (root / "owner-approval-gate.yml").read_text(encoding="utf-8")
          required_owner = (
              "github.event.comment.user.login == 'BenjaminHornung'",
              "/approve-head",
              "requested_sha",
              "current_head",
          )
          for marker in required_owner:
              if marker not in owner:
                  raise SystemExit(f"owner-approval-gate.yml: missing security marker: {marker}")
          if "secrets." in owner.casefold():
              raise SystemExit("owner-approval-gate.yml: owner gate must not consume secrets")

          print("Validated trusted-context and exact-head workflow boundaries.")
          PY

      - name: Enforce public licensing and policy notices
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import pathlib

          license_text = pathlib.Path("LICENSE").read_text(encoding="utf-8")
          readme_text = pathlib.Path("README.md").read_text(encoding="utf-8")
          notice_text = pathlib.Path("NOTICE").read_text(encoding="utf-8")
          security_text = pathlib.Path("SECURITY.md").read_text(encoding="utf-8")
          contributing_text = pathlib.Path("CONTRIBUTING.md").read_text(encoding="utf-8")

          if "PolyForm Noncommercial License 1.0.0" not in license_text:
              raise SystemExit("LICENSE: expected PolyForm Noncommercial 1.0.0 text is missing")
          if not license_text.startswith("Required Notice: Copyright 2026 Benjamin Hornung."):
              raise SystemExit("LICENSE: required copyright notice is missing")
          if "source-available, not open source" not in readme_text:
              raise SystemExit("README.md: public noncommercial status is not prominent")
          if "Commercial use is not permitted" not in notice_text:
              raise SystemExit("NOTICE: commercial-use prohibition is missing")
          if "security/advisories/new" not in security_text:
              raise SystemExit("SECURITY.md: private vulnerability reporting path is missing")
          if "/approve-head" not in contributing_text:
              raise SystemExit("CONTRIBUTING.md: exact-head owner approval procedure is missing")

          print("Validated public licensing, security and contribution notices.")
          PY
