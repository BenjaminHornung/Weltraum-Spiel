name: Repository Policy

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "docs/operations/public-repository-security.md"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "docs/operations/public-repository-security.md"

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Parse repository YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "psych"

          paths = Dir.glob(".github/**/*.{yml,yaml}").sort
          raise "No GitHub YAML files found" if paths.empty?

          paths.each do |path|
            Psych.parse_file(path)
            puts "Parsed #{path}"
          end
          RUBY

      - name: Enforce workflow trust and pinning policy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import pathlib
          import re
          import sys

          root = pathlib.Path(".github/workflows")
          workflows = sorted([*root.glob("*.yml"), *root.glob("*.yaml")])
          failures: list[str] = []

          allowed_target = {
              "codex-review-gate.yml",
              "owner-approval-gate.yml",
          }
          action_ref = re.compile(r"(?m)^\s*uses:\s*([^\s#]+)\s*(?:#.*)?$")
          full_sha = re.compile(r"^[^@\s]+@[0-9a-f]{40}$")
          forbidden_runner = re.compile(
              r"(?im)^\s*runs-on:\s*.*(?:self-hosted|weltraum-browser|truenas).*$"
          )
          write_all = re.compile(r"(?im)^\s*permissions:\s*write-all\s*$")

          for path in workflows:
              text = path.read_text(encoding="utf-8")

              if forbidden_runner.search(text):
                  failures.append(f"{path}: self-hosted runner routing or retired runner label is forbidden")

              if write_all.search(text):
                  failures.append(f"{path}: write-all workflow permission is forbidden")

              if re.search(r"(?m)^\s*id-token:\s*write\s*$", text):
                  failures.append(f"{path}: id-token write requires a separately reviewed policy change")

              for match in action_ref.finditer(text):
                  value = match.group(1)
                  if not full_sha.fullmatch(value):
                      failures.append(f"{path}: action is not pinned to a full commit SHA: {value}")

              has_target = bool(re.search(r"(?m)^\s{2}pull_request_target:\s*$", text))
              if has_target and path.name not in allowed_target:
                  failures.append(f"{path}: pull_request_target is not allowlisted")

              if path.name in allowed_target:
                  if not has_target:
                      failures.append(f"{path}: trusted-context workflow lost pull_request_target")
                  if "actions/checkout@" in text or re.search(r"(?im)\bgit\s+(?:clone|checkout|switch)\b", text):
                      failures.append(f"{path}: trusted-context workflow must never check out repository content")
                  if not re.search(r"(?m)^\s*contents:\s*read\s*$", text):
                      failures.append(f"{path}: trusted-context workflow must keep contents read-only")

          codex = (root / "codex-review-gate.yml").read_text(encoding="utf-8")
          if 'SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}' not in codex:
              failures.append("codex-review-gate.yml: fork trust classification is missing")
          if 'if: steps.classify.outputs.trusted == \'true\'' not in codex:
              failures.append("codex-review-gate.yml: secret-using steps are not trust-gated")
          if "short_sha_resolves_to_head" not in codex:
              failures.append("codex-review-gate.yml: unique short-SHA resolution is missing")

          owner = (root / "owner-approval-gate.yml").read_text(encoding="utf-8")
          if "github.event.comment.user.login == 'BenjaminHornung'" not in owner:
              failures.append("owner-approval-gate.yml: exact owner identity check is missing")
          if "/approve-head" not in owner or "requested_sha" not in owner or "current_head" not in owner:
              failures.append("owner-approval-gate.yml: exact-head approval command is incomplete")
          if "secrets." in owner.casefold():
              failures.append("owner-approval-gate.yml: owner gate must not consume secrets")

          license_text = pathlib.Path("LICENSE").read_text(encoding="utf-8")
          readme_text = pathlib.Path("README.md").read_text(encoding="utf-8")
          if "PolyForm Noncommercial License 1.0.0" not in license_text:
              failures.append("LICENSE: expected PolyForm Noncommercial 1.0.0 text is missing")
          if not license_text.startswith("Required Notice: Copyright 2026 Benjamin Hornung."):
              failures.append("LICENSE: required copyright notice is missing")
          if "source-available, not open source" not in readme_text:
              failures.append("README.md: public noncommercial status is not prominent")

          if failures:
              for failure in failures:
                  print(f"ERROR: {failure}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated {len(workflows)} workflows and public repository policy files.")
          PY
