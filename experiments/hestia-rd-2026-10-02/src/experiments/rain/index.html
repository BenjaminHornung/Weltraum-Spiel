<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hestia RD31 Regenlabor</title>
<style>body{margin:0;background:#14212a;color:#edf0ed;font:15px system-ui}header{padding:12px}label{display:inline-block;margin-right:12px}button,select,input{font:inherit;margin:4px;padding:5px}canvas{display:block;width:100%;max-width:1280px;aspect-ratio:16/9}pre{white-space:pre-wrap;max-height:28em;overflow:auto;padding:12px}a{color:#b6dbec}</style></head>
<body><header><h1>RD31 Regenlabor</h1><p>Modus: Darstellungs-Replay. Dächer und Owner wechseln als eingefrorene Laborquelle. Produkt unverändert.</p><a href="../../../index.html">Laborindex</a>
<label>Quelle <select id="scenario"></select></label><label>Abschattung <select id="variant"><option value="source-query">Voxel-Kontrolle</option><option value="depth-projection">CPU-Tiefe — Kandidat REJECT</option><option value="unshielded-control">Ohne Dachschutz — bewusst falsch</option></select></label>
<label>Wetter <select id="weather"><option value="clear">Klar</option><option value="breeze">Brise</option><option value="rain" selected>Regen</option><option value="gust-rain">Böe + Regen</option></select></label>
<button id="mount" disabled>Laborquelle starten</button><button id="dispose">Dispose</button><button id="play">Play</button><button id="pause">Pause</button>
<label>Tick <input id="tick" type="number" min="0" max="1800" value="0"></label><button id="seek">Seek</button><button id="reset">Reset</button><p id="status" role="status">Initialisieren</p></header>
<canvas id="view" width="1280" height="720" aria-label="Regen mit sourcegebundener Dachabschattung"></canvas><pre id="facts" aria-label="Quellen- und Rendererfakten"></pre><script type="module" src="./main.ts"></script></body></html>
