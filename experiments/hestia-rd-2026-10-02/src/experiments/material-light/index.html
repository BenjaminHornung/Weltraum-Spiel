<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Hestia RD14 Materiallabor</title>
<style>body{margin:0;background:#14212a;color:#edf0ed;font:15px system-ui}header{padding:12px}label{display:inline-block;margin-right:12px}button,select,input{font:inherit;margin:4px;padding:5px}canvas{display:block;width:100%;max-width:1280px;aspect-ratio:16/9}pre{white-space:pre-wrap;max-height:24em;overflow:auto;padding:12px}a{color:#b6dbec}</style></head>
<body><header><h1>RD14 Materiallabor</h1><p>Modus: Darstellungs-Replay / manuelle Materialparameter. Nässe hier ist ein Shader-Probeparameter; Exposition und Feuchteverlauf gehören zu RD32. Produkt unverändert.</p><a href="../../../index.html">Laborindex</a>
<label>Quelle <select id="scenario"></select></label><label>Material <select id="variant"><option value="rough-wet">Rauheit + Nässe</option><option value="basic-lit">BasicLit-Kontrolle</option></select></label>
<label>Ansicht <select id="viewMode"><option value="color">Farbe</option><option value="normal">Normal</option><option value="depth">Depth</option><option value="roughness">Rauheit</option><option value="wetness">Nässe</option></select></label>
<label>Kamera <select id="camera"></select></label><label>Wetter <select id="weather"><option value="clear">Klar</option><option value="breeze">Brise</option><option value="rain">Regen</option><option value="gust-rain">Böe + Regen</option></select></label>
<label>Manuelle Nässe <input id="wetness" type="range" min="0" max="1" step="0.05" value="0"><output id="wetnessValue">0</output></label>
<button id="mount" disabled>Laborquelle starten</button><button id="dispose">Dispose</button><button id="play">Play</button><button id="pause">Pause</button>
<label>Tick <input id="tick" type="number" min="0" max="1800" value="0"></label><button id="seek">Seek</button><button id="reset">Reset</button><p id="status" role="status">Initialisieren</p></header>
<canvas id="view" width="1280" height="720" aria-label="Sourcegebundenes Materiallabor"></canvas><pre id="facts" aria-label="Quellen- und Materialfakten"></pre><script type="module" src="./main.ts"></script></body></html>
