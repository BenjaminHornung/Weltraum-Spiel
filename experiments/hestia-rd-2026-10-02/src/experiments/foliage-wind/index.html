<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hestia RD21 Windlabor</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#131a22;color:#e9edf1}body{max-width:1280px;margin:1rem auto;padding:0 1rem}fieldset{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}button,input,select{font:inherit}canvas{display:block;width:100%;aspect-ratio:16/9}pre{white-space:pre-wrap;max-height:18rem;overflow:auto;font-size:.8rem}:focus-visible{outline:2px solid #ffc665}input[type=number]{width:6rem}</style></head>
<body><h1>Windlabor</h1><p>Kontrolliertes Source-Replay · ein Three/WebGL2-Renderer · PRODUCT_INTEGRATED=false · ART=PENDING_OWNER</p>
<fieldset><legend>Quelle und Vergleich</legend><label>Szenario <select id="scenario"></select></label><label>Variante <select id="variant"><option value="static">Statisch</option><option value="rigid" selected>Starre Dekorcluster</option><option value="vertex">Vertex-Gegenprobe</option></select></label><button id="mount" disabled>Starten</button><button id="dispose">Dispose</button></fieldset>
<fieldset><legend>Gemeinsame Wetter-/Sourcezeit</legend><label>Wetter <select id="weather"><option value="clear">Klar</option><option value="breeze" selected>Brise</option><option value="rain">Regen</option><option value="gust-rain">Böiger Regen</option></select></label><button id="play">Play</button><button id="pause">Pause</button><label>Tick <input id="tick" type="number" min="0" max="3600" step="1" value="0"></label><button id="seek">Seek</button><button id="reset">Reset</button></fieldset>
<label>Lifecycle-Ansicht <select id="lifecycleView"><option value="all">Alle</option><option value="wood">Holz</option><option value="decor">Dekor</option><option value="bounds">Owner-Bounds</option></select></label><p id="status" role="status" aria-live="polite">Quellen laden…</p><canvas id="view" width="1280" height="720" aria-label="Wind auf eingefrorener Labquelle"></canvas><details open><summary>Source, Owner und Ressourcen</summary><pre id="facts">{}</pre></details><script type="module" src="./main.ts"></script></body></html>
