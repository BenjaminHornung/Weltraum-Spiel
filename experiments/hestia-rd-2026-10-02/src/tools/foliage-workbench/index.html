<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hestia Habitatwerkbank</title><link rel="stylesheet" href="../lab.css"></head><body>
<h1>Habitatwerkbank</h1><p>Labor-Draft · kein Produktcontent · ART=PENDING_OWNER</p>
<fieldset><legend>Geometrie-Draft</legend><label>Familie <select id="shape"><option value="mixed">Gemischt</option><option value="young">Jung</option><option value="umbrella">Schirm</option><option value="buttress">Wurzelbogen</option></select></label><label>Seed <input id="seed" type="number" min="0" max="4294967295" value="23"></label><label>Höhe/Zellen <input id="height" type="number" min="16" max="48" value="30"></label><label>Kronenradius/Zellen <input id="crown" type="number" min="1" max="8" value="4"></label><label>Wurzelausdehnung <input id="roots" type="number" min=".25" max="1" step=".05" value="1"></label><label>Dichte <input id="density" type="number" min="0" max="1" step=".1" value="1"></label><label>Freie Mitte <input id="clearing" type="checkbox" checked></label><button id="validate">Validate Draft</button><button id="preview">Preview</button><button id="cancel">Cancel</button><button id="undo">Undo</button><button id="redo">Redo</button></fieldset>
<fieldset><legend>Wind ohne Geometrieneubau</legend><label>Variante <select id="variant"><option value="rigid">Starre Cluster</option><option value="static">Statisch</option><option value="vertex">Vertex-Gegenprobe</option></select></label><label>Amplitude m/s <input id="amplitude" type="number" min="0" max="60" value="3"></label><label>Steifigkeit <input id="stiffness" type="number" min="0" max="1" step=".05" value=".75"></label><label>Phase/Ticks <input id="phase" type="number" min="0" max="3600" value="0"></label><button id="wind">Wind übernehmen</button><label>Tick <input id="tick" type="number" min="0" max="3600" value="0"></label><button id="seek">Seek</button><label>Kamera <select id="camera"><option value="habitat-overview">Übersicht</option><option value="habitat-roots">Wurzeln</option></select></label><button id="dispose">Dispose</button></fieldset>
<p id="status" role="status" aria-live="polite">Laden…</p><canvas id="view" width="1280" height="720" aria-label="Habitat mit Holz, separaten Kronen und Unterbewuchs"></canvas>
<details open><summary>Draft, Support, Kosten und aktive Quelle</summary><pre id="facts">{}</pre></details><fieldset><legend>Lokales versioniertes Labpreset</legend><button id="export">JSON exportieren</button><label>Datei <input id="file" type="file" accept="application/json,.json"></label><button id="import">JSON importieren</button></fieldset><textarea id="json" aria-label="Labpreset JSON"></textarea><script type="module" src="./main.ts"></script></body></html>
