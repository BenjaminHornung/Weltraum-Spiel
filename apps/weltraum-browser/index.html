<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weltraum Browser</title>
  </head>
  <body>
    <main id="app">
      <canvas id="debug-scene" aria-label="Three.js autopilot debug scene"></canvas>
      <section id="hud" data-testid="basic-hud">
        <div class="label">Plan</div>
        <div id="plan-hash">pending</div>
        <div class="label">Mode</div>
        <div id="mode">unknown</div>
        <div class="label">Status</div>
        <div id="status" aria-live="polite" data-testid="autopilot-active">booting</div>
        <div class="label">Route</div>
        <div id="route-status">unknown</div>
        <div class="label">Selected Target</div>
        <div id="target-status" data-testid="selected-target">none selected</div>
        <div class="label">Distance</div>
        <div id="target-distance">n/a</div>
        <div class="label">Fuel</div>
        <div id="fuel-status">unknown</div>
        <div class="label">Authority</div>
        <div id="authority-status">unknown</div>
        <div class="label">Brake Reserve</div>
        <div id="brake-status">unknown</div>
        <div class="label">Warnings</div>
        <div id="warning-chips" class="warning-chip-strip" aria-live="polite" data-testid="warning-state">none</div>
        <div class="label">Warning Summary</div>
        <div id="failure-reasons">none</div>
        <div class="label">Autopilot Commands</div>
        <div class="hud-actions">
          <button id="engage-autopilot" type="button">Engage route</button>
          <button id="cancel-autopilot" type="button">Cancel autopilot</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
