[package]
name = "hestia_rapier3d_phy01"
version = "0.21.0"
edition = "2018"
license = "Apache-2.0"

[workspace]

[features]
default = ["dim3"]
dim3 = []

[lib]
name = "rapier_wasm3d"
path = "../source/bindings/typescript/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rapier3d = { path = "../source/crates/rapier3d", features = ["serde-serialize", "debug-render", "profiler", "fem"] }
parry3d = { version = "0.31", default-features = false, features = ["required-features"] }
ref-cast = "1"
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
nalgebra = "0.35"
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
palette = "0.7"

[patch.crates-io]
parry3d = { path = "../parry3d" }

[profile.release]
debug = false
codegen-units = 1
strip = true

[[test]]
name = "positive_margin_cell_discovery"
path = "tests/positive_margin_cell_discovery.rs"
required-features = ["dim3"]
